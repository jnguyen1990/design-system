<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card</title>
<link rel="stylesheet" href="../../design-system.css">
<style>
  /* Preview-card frame only; everything inside uses design-system classes. */
  html, body { margin: 0; padding: 0; }
  body { padding: 20px; }
  .pv-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pv-row:last-child { margin-bottom: 0; }
  .pv-label { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-faint); width: 72px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="columns-2">
    <div class="stat-card card-dense">
      <div class="stat-label">Checking</div>
      <div class="stat-value">$4,218.42</div>
      <div class="stat-subtext">+$120.50 this week</div>
    </div>
    <a class="card card-link" href="#">
      <h3 class="card-title">Pull · upper</h3>
      <p class="card-subtitle">Last workout · 2d ago · 6 lifts</p>
    </a>
  </div>
</body>
</html>
