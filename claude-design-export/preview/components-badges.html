<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badges</title>
<link rel="stylesheet" href="../../design-system.css">
<style>
  /* Preview-card frame only; everything inside uses design-system classes. */
  html, body { margin: 0; padding: 0; }
  body { padding: 20px; }
  .pv-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pv-row:last-child { margin-bottom: 0; }
  .pv-label { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-faint); width: 72px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="pv-row">
    <span class="badge badge--red">Overdue</span>
    <span class="badge badge--orange">In progress</span>
    <span class="badge badge--amber">Pending</span>
    <span class="badge badge--green">Complete</span>
    <span class="badge badge--teal">Info</span>
  </div>
  <div class="pv-row">
    <span class="badge badge--blue">Selected</span>
    <span class="badge badge--indigo">Primary</span>
    <span class="badge badge--purple">Featured</span>
    <span class="badge badge--pink">Personal</span>
    <span class="badge badge--slate">Note</span>
  </div>
  <div class="pv-row">
    <span class="badge badge-success">Synced</span>
    <span class="badge badge-warning">Stale</span>
    <span class="badge badge-error">Failed</span>
    <span class="badge badge-info">Queued</span>
    <span class="badge badge-accent">Accent</span>
  </div>
</body>
</html>
