<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inputs</title>
<link rel="stylesheet" href="../../design-system.css">
<style>
  /* Preview-card frame only; everything inside uses design-system classes. */
  html, body { margin: 0; padding: 0; }
  body { padding: 20px; }
  .pv-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pv-row:last-child { margin-bottom: 0; }
  .pv-label { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-faint); width: 72px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="columns-2">
    <div class="form-group">
      <label class="form-label" for="pv-desc">Description</label>
      <input class="form-control" id="pv-desc" placeholder="e.g. groceries">
      <div class="form-hint">A short, searchable label.</div>
    </div>
    <div class="form-group">
      <label class="form-label" for="pv-amount">Amount</label>
      <input class="form-control" id="pv-amount" value="" inputmode="decimal" aria-invalid="true" aria-describedby="pv-amount-err">
      <div class="form-error" id="pv-amount-err">Amount required</div>
    </div>
    <div class="form-group">
      <label class="form-label" for="pv-cat">Category</label>
      <select class="form-control" id="pv-cat"><option>Groceries</option><option>Dining</option></select>
    </div>
    <div class="form-group">
      <label class="form-label" for="pv-date">Date</label>
      <input class="form-control" id="pv-date" type="date" value="2026-04-22">
    </div>
  </div>
</body>
</html>
