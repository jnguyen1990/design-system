<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table</title>
<link rel="stylesheet" href="../../design-system.css">
<style>
  /* Preview-card frame only; everything inside uses design-system classes. */
  html, body { margin: 0; padding: 0; }
  body { padding: 20px; }
  .pv-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pv-row:last-child { margin-bottom: 0; }
  .pv-label { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-faint); width: 72px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="table-responsive">
    <table>
      <thead>
        <tr><th>Date</th><th>Payee</th><th>Category</th><th class="text-right">Amount</th></tr>
      </thead>
      <tbody>
        <tr><td class="td-date">Apr 22</td><td>Whole Foods</td><td><span class="badge badge--green">Groceries</span></td><td class="td-amount text-amount-negative">−$84.20</td></tr>
        <tr><td class="td-date">Apr 21</td><td>Acme Corp · payroll</td><td><span class="badge badge--teal">Income</span></td><td class="td-amount text-amount-positive">+$3,400.00</td></tr>
        <tr><td class="td-date">Apr 20</td><td>Spotify</td><td><span class="badge badge--purple">Subscriptions</span></td><td class="td-amount text-amount-negative">−$10.99</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
